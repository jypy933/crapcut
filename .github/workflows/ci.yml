name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg for render tests (pinned, checksum verified)
        shell: pwsh
        run: ./scripts/ci/install-ffmpeg.ps1

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and render tests
        run: npm test

      - name: Build
        run: npm run build

      - name: UI smoke test (real Electron app)
        run: npm run test:ui
